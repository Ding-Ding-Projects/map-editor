name: Documentation site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # The site bundles its fonts from the font packages.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Release list for the Downloads page
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api "repos/${{ github.repository }}/releases?per_page=20" > site/releases.json || echo '[]' > site/releases.json
      - run: node site/build.mjs
        env: { SITE_BASE: /map-editor/ }
      - name: Squirrel update feeds from the latest release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node scripts/update-feed.mjs site/dist/updates
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
