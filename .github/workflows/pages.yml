name: Documentation site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # a stuck step fails the job instead of holding every later release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # The site bundles its fonts from the font packages.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Release list for the Downloads page
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api "repos/${{ github.repository }}/releases?per_page=20" > site/releases.json || echo '[]' > site/releases.json
      - run: node site/build.mjs
        env: { SITE_BASE: /map-editor/ }
      - name: Phone edition of the guide as a PDF
        run: |
          # Serve the built site under its base path so the page's links and pictures resolve, then print it.
          mkdir -p /tmp/serve && ln -s "$PWD/site/dist" /tmp/serve/map-editor
          (cd /tmp/serve && python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf=site/dist/map-editor-guide-phone.pdf http://127.0.0.1:8765/map-editor/phone/
          test -s site/dist/map-editor-guide-phone.pdf && ls -l site/dist/map-editor-guide-phone.pdf
          # The Cantonese edition needs a Chinese font on the runner, or the PDF would be empty boxes.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 update -qq && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y -qq fonts-noto-cjk >/dev/null
          fc-list :lang=zh-hk | head -1 | grep -q . || { echo 'No Chinese font installed'; exit 1; }
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf=site/dist/map-editor-guide-phone-yue.pdf http://127.0.0.1:8765/map-editor/phone-yue/
          test -s site/dist/map-editor-guide-phone-yue.pdf && ls -l site/dist/map-editor-guide-phone-yue.pdf
      - name: Squirrel update feeds from the latest release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: node scripts/update-feed.mjs site/dist/updates
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10 # a stuck step fails the job instead of holding every later release
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
