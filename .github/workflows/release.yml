name: Build and release
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  actions: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/ding-ding-projects/map-editor
jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5 # a stuck step fails the job instead of holding every later release
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      started: ${{ steps.v.outputs.started }}
      date: ${{ steps.v.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          # Every build gets a higher version (major.minor from package.json, patch = run number)
          # so Squirrel updates and image tags always move forward.
          V=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')").${{ github.run_number }}
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"


  docker:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # a stuck step fails the job instead of holding every later release
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
            SOURCE_DATE=${{ needs.meta.outputs.date }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.meta.outputs.tag }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
      - name: Compose smoke test against the pushed image
        run: |
          mkdir -p /tmp/worlds
          MAP_EDITOR_VERSION=${{ needs.meta.outputs.tag }} MAP_EDITOR_WORLDS_DIR=/tmp/worlds docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8420/api/health && exit 0; sleep 2; done
          docker compose logs; exit 1
      - name: Save the amd64 image for the appliance
        # skopeo copies exactly one platform from the registry. A docker pull and save of the same tag
        # for two platforms can save the host platform twice, which put an amd64 image on the Pi.
        run: |
          skopeo copy --override-os linux --override-arch amd64 \
            docker://${{ env.IMAGE }}:${{ needs.meta.outputs.tag }} \
            docker-archive:map-editor-image.tar:${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
          node scripts/image-arch.mjs map-editor-image.tar amd64
      - uses: actions/upload-artifact@v4
        with: { name: image-tar, path: map-editor-image.tar, retention-days: 3 }
      - name: Save the arm64 image for the Raspberry Pi appliance
        run: |
          skopeo copy --override-os linux --override-arch arm64 \
            docker://${{ env.IMAGE }}:${{ needs.meta.outputs.tag }} \
            docker-archive:map-editor-image-arm64.tar:${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
          node scripts/image-arch.mjs map-editor-image-arm64.tar arm64
      - uses: actions/upload-artifact@v4
        with: { name: image-tar-arm64, path: map-editor-image-arm64.tar, retention-days: 3 }
      - run: echo "${{ steps.build.outputs.digest }}" > image-digest.txt
      - uses: actions/upload-artifact@v4
        with: { name: image-digest, path: image-digest.txt }

  appliance:
    needs: [meta, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # a stuck step fails the job instead of holding every later release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image-tar }
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y qemu-utils qemu-system-x86 curl fdisk e2fsprogs parted
      - name: Build appliance image
        # The build downloads tools from servers outside GitHub; one of them answering with an error for a
        # moment cost a release both images, so the build is tried up to three times.
        run: |
          for attempt in 1 2 3; do
            if sudo appliance/build.sh map-editor-image.tar ${{ needs.meta.outputs.version }}; then exit 0; fi
            echo "Image build attempt $attempt failed."; sleep $((attempt * 30))
          done
          exit 1
      - name: Boot test under QEMU
        run: sudo appliance/boot-test.sh appliance/out/map-editor-appliance-x86_64.img
      - run: sudo xz -T0 -k appliance/out/map-editor-appliance-x86_64.img
      - uses: actions/upload-artifact@v4
        with:
          name: appliance
          path: |
            appliance/out/map-editor-appliance-x86_64.img.xz
            appliance/out/map-editor-appliance-x86_64.ova
            appliance/out/SHA256SUMS

  appliance-pi:
    # Built and checked for the Pi firmware, kernel and device trees; it cannot be boot-tested here,
    # so a failure does not block the other downloads.
    needs: [meta, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # a stuck step fails the job instead of holding every later release
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: image-tar-arm64 }
      # Registers static qemu for arm64 with the fix-binary flag, so arm64 programs run inside the chroot.
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120 install -y dosfstools fdisk e2fsprogs parted xz-utils
      - name: Build Raspberry Pi appliance image
        # The build downloads tools from servers outside GitHub; one of them answering with an error for a
        # moment cost a release both images, so the build is tried up to three times.
        run: |
          for attempt in 1 2 3; do
            if sudo appliance/build-pi.sh map-editor-image-arm64.tar ${{ needs.meta.outputs.version }}; then exit 0; fi
            echo "Image build attempt $attempt failed."; sleep $((attempt * 30))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: appliance-pi
          path: |
            appliance/out/map-editor-appliance-rpi-arm64.img.xz
            appliance/out/SHA256SUMS-rpi

  desktop:
    needs: meta
    runs-on: windows-2022
    timeout-minutes: 40 # a stuck step fails the job instead of holding every later release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: node scripts/build.mjs
        env: { APP_VERSION: '${{ needs.meta.outputs.version }}', SOURCE_COMMIT: '${{ github.sha }}', SOURCE_DATE: '${{ needs.meta.outputs.date }}' }
      - run: node scripts/package-desktop.mjs
        env: { APP_VERSION: '${{ needs.meta.outputs.version }}' }
      - name: Installers must be unsigned
        shell: pwsh
        run: |
          Get-ChildItem out/installers -Recurse -Filter *.exe | ForEach-Object {
            $s = (Get-AuthenticodeSignature $_.FullName).Status
            if ($s -ne 'NotSigned') { throw "$($_.Name) reports $s, expected NotSigned" }
            "$($_.Name): $s"
          }
      - uses: actions/upload-artifact@v4
        with: { name: desktop, path: out/installers/** }

  release:
    needs: [meta, docker, appliance, appliance-pi, desktop]
    # The appliance images may be missing from a release, but the Docker image and the Windows apps may not:
    # without them a release would be empty or useless to update to.
    if: always() && needs.meta.result == 'success' && needs.docker.result == 'success' && needs.desktop.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # a stuck step fails the job instead of holding every later release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: desktop, path: assets/desktop }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: appliance, path: assets/appliance }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: image-digest, path: assets/image }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: appliance-pi, path: assets/appliance-pi }
      - name: Guide as phone-sized PDFs for the release (the release still goes out if this step fails)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          echo '[]' > site/releases.json
          SITE_BASE=/map-editor/ node site/build.mjs
          mkdir -p /tmp/serve assets/guide && ln -s "$PWD/site/dist" /tmp/serve/map-editor
          (cd /tmp/serve && python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf=assets/guide/map-editor-guide-phone.pdf http://127.0.0.1:8765/map-editor/phone/
          test -s assets/guide/map-editor-guide-phone.pdf
          # The Cantonese edition is only made when the runner already has a Chinese font: installing one here
          # took six minutes in one run. Without it the PDF would be empty boxes, so it is left out instead.
          if fc-list :lang=zh | grep -q .; then
            google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
              --print-to-pdf=assets/guide/map-editor-guide-phone-yue.pdf http://127.0.0.1:8765/map-editor/phone-yue/
            test -s assets/guide/map-editor-guide-phone-yue.pdf || rm -f assets/guide/map-editor-guide-phone-yue.pdf
          else
            echo "No Chinese font on this runner; the Cantonese PDF stays on the documentation site only."
          fi
          ls -l assets/guide
      - name: Publish one normal release for this commit
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.ORG_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          DONE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # The start is the earliest time GitHub recorded any job of this run starting; the first job's
          # own clock is the fallback if that cannot be read.
          START=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" --jq '[.jobs[].started_at | select(. != null)] | min' 2>/dev/null || true)
          echo "$START" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$' || START="${{ needs.meta.outputs.started }}"
          DUR=$(( $(date -u -d "$DONE" +%s) - $(date -u -d "$START" +%s) ))
          {
            echo "Map Editor ${{ needs.meta.outputs.version }} built from ${{ github.sha }}."
            echo
            echo "Jobs: docker=${{ needs.docker.result }}, appliance=${{ needs.appliance.result }}, raspberry-pi=${{ needs.appliance-pi.result }}, desktop=${{ needs.desktop.result }}. Assets are attached only for jobs that succeeded."
            echo "The Raspberry Pi image (Pi 4 and 5) is checked for its firmware, kernel, device trees and an arm64 container here, and after publishing it is booted on QEMU's Raspberry Pi 4 machine until the web app answers (the Real-world checks workflow). It has not been tested on a physical Pi."
            echo
            # What was checked before the commit, stated only when the record matches these exact files.
            node scripts/local-checks.mjs notes || echo "Checks before this commit: unavailable. This workflow runs no tests and no lint."
            echo
            node scripts/code-name.mjs "${{ needs.meta.outputs.version }}" || echo "Code name: unavailable"
            echo
            echo "Docker image: ${{ env.IMAGE }}:${{ needs.meta.outputs.version }} (digest in image-digest.txt)."
            echo "The Windows installers are not code-signed, so Windows SmartScreen may warn before running them."
            echo
            # Line counts of the tracked files at this commit, from the committed counter (kinds, parts, total, exclusions).
            node scripts/line-counts.mjs || echo "Line counts: unavailable"
            echo
            echo "Workflow started: $START"
            echo "Workflow completed: $DONE"
            printf 'Workflow duration: %02d:%02d:%02d (%ss)\n' $((DUR / 3600)) $((DUR % 3600 / 60)) $((DUR % 60)) "$DUR"
          } > notes.md
          mkdir -p assets
          # Squirrel names every package RELEASES; give each app's feed its own name so both upload.
          for d in assets/desktop/*/; do [ -f "$d/RELEASES" ] && mv "$d/RELEASES" "$d/RELEASES-$(basename "$d")"; done
          mapfile -d '' FILES < <(find assets -type f \( -name '*.exe' -o -name 'RELEASES-*' -o -name '*.nupkg' -o -name '*.ova' -o -name '*.img.xz' -o -name 'map-editor-guide-phone*.pdf' -o -name 'SHA256SUMS' -o -name 'SHA256SUMS-rpi' -o -name 'image-digest.txt' \) -print0)
          # Never publish a release without its Windows installers.
          printf '%s\n' "${FILES[@]}" | grep -q 'Map.EditorSetup.exe$' || { echo 'Map.EditorSetup.exe is missing; not publishing a release.'; exit 1; }
          # GitHub now and then answers 403 to release creation for a moment; try three times, and
          # never leave a half-made release behind.
          # First with --target; if GitHub refuses, push the tag with git and create the release on it.
          TAG="${{ needs.meta.outputs.tag }}"
          for attempt in 1 2 3 4 5; do
            if gh release create "$TAG" --target "${{ github.sha }}" --title "Map Editor $TAG" --notes-file notes.md "${FILES[@]}"; then break; fi
            gh release delete "$TAG" --yes 2>/dev/null || true
            git tag -f "$TAG" "${{ github.sha }}" && git push -f origin "refs/tags/$TAG" || true
            if gh release create "$TAG" --verify-tag --title "Map Editor $TAG" --notes-file notes.md "${FILES[@]}"; then break; fi
            gh release delete "$TAG" --yes 2>/dev/null || true
            [ "$attempt" = 5 ] && exit 1
            echo "Release creation failed (attempt $attempt); retrying in $((attempt * 45)) s"; sleep $((attempt * 45))
          done
          # Refresh the update feeds on the documentation site for the release just published.
          gh workflow run pages.yml --ref main || echo "Could not start the site rebuild; the update feed will refresh on the next push."
          gh release view "${{ needs.meta.outputs.tag }}" --json tagName,isDraft,isPrerelease,targetCommitish,assets --jq '{tag: .tagName, draft: .isDraft, prerelease: .isPrerelease, target: .targetCommitish, assets: [.assets[].name]}'
